
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rocket Bay Browser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="logo" href="./">🚀 ROCKET BAY</a>
    <span class="status">BROWSER BETA</span>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">YOUR INTERNET. YOUR ZONE.</p>
      <h1>ROCKET BAY <span>BROWSER</span></h1>
      <p>Where gaming meets the web.</p>

      <form id="searchForm">
        <input id="search" placeholder="Search anything on the web..."
               aria-label="Search the web" required>
        <button type="submit">SEARCH ↗</button>
      </form>
    </section>

    <section class="panel">
      <h2>Quick destinations</h2>
      <div class="links">
        <a href="https://www.roblox.com/" target="_blank"
           rel="noopener noreferrer">🎮 Roblox ↗</a>
        <a href="https://now.gg/" target="_blank"
           rel="noopener noreferrer">🕹️ now.gg ↗</a>
        <a href="https://whatsup.ai/" target="_blank"
           rel="noopener noreferrer">✦ WhatsUp.ai ↗</a>
      </div>
    </section>

    <section class="panel">
      <h2>Open a website</h2>
      <form id="urlForm">
        <input id="url" placeholder="Enter a website address..."
               aria-label="Website address" required>
        <button type="submit">OPEN ↗</button>
      </form>
      <p id="message" role="status"></p>
    </section>
  </main>

  <footer>ROCKET BAY GAMING · WEB BROWSER</footer>
  <script src="script.js"></script>
</body>
</html>
