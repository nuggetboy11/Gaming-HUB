
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rocket Bay Gaming</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <a href="/" class="logo">🚀 ROCKET BAY</a>
    <span class="status">GAMING BROWSER</span>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">YOUR PERSONAL GAME HUB</p>
      <h1>ROCKET BAY <span>GAMING</span></h1>
      <p>One hub for your favorite destinations.</p>
    </section>

    <nav class="tabs">
      <button data-site="roblox">Roblox</button>
      <button data-site="nowgg">now.gg</button>
      <button data-site="whatsup">WhatsUp.ai</button>
    </nav>

    <section class="browser">
      <div class="toolbar">
        <button id="home">⌂</button>
        <button id="back">←</button>
        <button id="refresh">↻</button>
        <input id="address" placeholder="Enter an authorized destination">
        <button id="go">Go ↗</button>
      </div>

      <div id="viewer">
        <div class="welcome">
          <div class="orb">🚀</div>
          <h2>Ready to launch?</h2>
          <p>Choose a destination above to get started.</p>
          <p id="message" role="status"></p>
        </div>
      </div>
    </section>
  </main>

  <script src="/script.js"></script>
</body>
</html>
