
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rocket Bot Royale Player</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #090d18;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      background: #121a2b;
      padding: 18px 24px;
      border-bottom: 1px solid #303b55;
      font-size: 22px;
      font-weight: bold;
    }
    header span { color: #8c7cff; }
    main {
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 16px;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }
    h1 { font-size: 26px; margin: 0; }
    button, .open {
      background: #7967f5;
      color: white;
      border: 0;
      padding: 12px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }
    .player {
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 320px;
      overflow: hidden;
      border: 1px solid #303b55;
      border-radius: 12px;
      background: #03050a;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
    .help {
      color: #b3bdd1;
      line-height: 1.6;
      margin-top: 18px;
      font-size: 14px;
    }
    @media (max-width: 600px) {
      .player { aspect-ratio: 4 / 3; min-height: 250px; }
    }
  </style>
</head>
<body>
  <header>ROCKET BOT <span>ROYALE</span></header>

  <main>
    <div class="toolbar">
      <h1>Rocket Bot Royale</h1>
      <div>
        <button onclick="document.getElementById('game').requestFullscreen()">
          ⛶ Fullscreen
        </button>
        <a class="open"
           href="https://rocketbotroyale.winterpixel.io/"
           target="_blank" rel="noopener noreferrer">
          Open Game ↗
        </a>
      </div>
    </div>

    <div class="player" id="player">
      <iframe
        id="game"
        src="https://www.rocketgames.io/game/rocket-bot-royale"
        title="Rocket Bot Royale"
        allowfullscreen>
      </iframe>
    </div>

    <p class="help">
      If the game doesn't appear in the player, open it directly.
      Some websites prevent their pages from being embedded.
    </p>
  </main>
</body>
</html>
